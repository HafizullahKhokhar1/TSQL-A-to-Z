name: Feature request
about: Suggest a new lesson, exercise, or repo improvement
labels: [enhancement]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be added or improved?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Learning value
      description: Why would this help a learner?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add any examples, references, or constraints.
