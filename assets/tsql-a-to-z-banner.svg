<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">T-SQL A to Z banner</title>
  <desc id="desc">Dark professional banner for a SQL Server learning repository with an AI-assisted note.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#111c2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#8fb3ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1d3a5d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>
  <circle cx="1330" cy="115" r="180" fill="#12253d" opacity="0.35"/>
  <circle cx="1230" cy="295" r="220" fill="#0f1f33" opacity="0.55"/>
  <g transform="translate(120,96)">
    <rect x="0" y="0" width="150" height="228" rx="24" fill="#0e1928" stroke="#23324a" stroke-width="2"/>
    <ellipse cx="75" cy="48" rx="44" ry="16" fill="#263a57"/>
    <path d="M31 48v118c0 10 20 19 44 19s44-9 44-19V48" fill="none" stroke="#365174" stroke-width="2"/>
    <path d="M31 86c0 10 20 19 44 19s44-9 44-19" fill="none" stroke="#365174" stroke-width="2"/>
    <path d="M31 125c0 10 20 19 44 19s44-9 44-19" fill="none" stroke="#365174" stroke-width="2"/>
    <path d="M31 164c0 10 20 19 44 19s44-9 44-19" fill="none" stroke="#365174" stroke-width="2"/>
    <circle cx="119" cy="52" r="6" fill="#4cc9f0"/>
  </g>
  <text x="340" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="700" fill="#f4f7fb" letter-spacing="1">T-SQL A to Z</text>
  <text x="342" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#b7c6da">Beginner to Expert (SQL Server)</text>
  <text x="343" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#8ca3bf">Lessons, exercises, and projects for steady SQL practice.</text>
  <text x="1288" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7fa3c7" text-anchor="end">AI-assisted</text>
  <path d="M1246 342h82" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
